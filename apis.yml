name: Springpath
description: >-
  Springpath Inc. was a Sunnyvale, California hyperconverged infrastructure
  startup, backed by Redpoint Ventures, whose distributed data-platform
  technology became the basis for Cisco HyperFlex Systems. Cisco moved to
  acquire the company (announced 2016) and folded its software into the
  HyperFlex product line. Cisco announced the discontinuation of HyperFlex
  infrastructure products in September 2023, and Springpath no longer operates
  as an independent company. The springpathinc.com domain is now served by
  Cisco nameservers and no longer hosts a live website, developer portal, or
  public API. This profile is retained in the API Evangelist network as an
  historical/acquired-company record; there is no independent API surface to
  enrich.
